url: https://statmodels7.github.io/penalties7

template:
  bootstrap: 5

navbar:
  structure:
    left:  [reference]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: The class and the generics
  desc: >
    The base class and the generics of every penalty: the value with
    its normalizing constant, the derivatives in the coefficients and
    in the hyperparameters, the mixed block, the points where the
    penalty is not smooth, and the predicates and quantities that a
    fitting layer reads.
  contents:
  - penalty
  - penalty_value
  - penalty_gradient
  - penalty_grad_theta
  - penalty_kinks
  - penalty_readable
  - penalty_draw
  - is_proper
  - is_quadratic
  - penalty_matrix
- title: Derivatives for a marginal criterion
  desc: >
    A Laplace approximation to a marginal likelihood differentiates the
    determinant of the penalized information, so it needs the
    hyperparameter derivatives of the coefficient Hessian and of the
    mixed block. The hyperparameters of a penalty that supplies them can
    be estimated by REML or ML. SCAD, MCP and a separable penalty with a
    kink do not supply them.
  contents:
  - penalty_dhessian
  - penalty_d2hessian
  - penalty_dcross
  - penalty_dhessian_beta
  - penalty_d2hessian_beta
  - penalty_dhessian_beta_theta
  - beta_quadratic
- title: The quadratic branch
  desc: >
    A fixed matrix P, an optional map D and one smoothing parameter
    lambda, so the penalty is the negative log-density of a Gaussian
    prior with precision lambda D'PD, improper when D'PD is singular.
    The rank, the null basis and the log pseudo-determinant are
    computed from D'PD when the object is built.
  contents:
  - quadratic_penalty
  - QuadraticPenalty
  - ends_with(".QuadraticPenalty")
- title: The additive branch
  desc: >
    A sum of quadratic penalties with a smoothing parameter on each,
    which is the penalty of an anisotropic tensor-product smooth. The
    rank is computed at construction from the sum of the components,
    each divided by its largest absolute entry, because the null space
    of the sum does not depend on the smoothing parameters.
  contents:
  - additive_penalty
  - AdditivePenalty
  - ends_with(".AdditivePenalty")
- title: The separable branch
  desc: >
    The negative log-density of a continuous distributions7 family at
    the coordinates of the mapped coefficients, one coordinate at a
    time for a univariate family and one block at a time for a
    multivariate one. The lasso is a Laplace at zero, the elastic net
    the product of a Laplace and a Gaussian, and the heavy-tailed prior
    a Student t. The ridge, documented with them, is the Gaussian at
    zero written by its precision and is built on the quadratic
    branch.
  contents:
  - distrib_penalty
  - distrib_kinks
  - ridge_penalty
  - DistribPenalty
  - ends_with(".DistribPenalty")
- title: The structured branch
  desc: >
    A parameters7 matrix parameter used as the precision, so the
    hyperparameters are the free values of that structure and every
    derivative comes from its derivative arrays.
  contents:
  - structured_penalty
  - StructuredPenalty
  - ends_with(".StructuredPenalty")
- title: SCAD and MCP
  desc: >
    Defined by their derivative rather than by a density. Their value
    is bounded, so exp(-value) is not integrable: they are improper,
    carry no normalizing constant and cannot come from a
    distribution.
  contents:
  - scad_penalty
  - ScadPenalty
  - ends_with(".ScadPenalty")
  - ends_with(".McpPenalty")
- title: The proximal operator
  desc: >
    The operator that a proximal gradient method applies after each
    gradient step: a linear solve for the quadratic and structured
    branches, a closed form for the Gaussian, Laplace, elastic-net,
    SCAD and MCP penalties, and a coordinatewise root for any other
    separable parent with a smooth log-density.
  contents:
  - penalty_prox
  - penalty_prox_spec
  - prox_apply
  - has_prox
- title: Validation
  desc: >
    Numerical checks of the derivatives of a penalty, meant above all
    for a penalty written outside the package.
  contents:
  - check_penalty
